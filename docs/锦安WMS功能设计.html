ng:17px 13px 0;font-size:11px;color:var(--muted)}.aside-bottom strong{display:block;color:#4e535d;font-weight:500;margin-bottom:4px}main{padding:30px 36px 50px;max-width:1500px;width:100%;margin:auto}.breadcrumb{font-size:11px;color:var(--muted);margin-bottom:17px}.breadcrumb span{color:var(--red);margin:0 7px}.title-row{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:25px}h1{font-size:29px;letter-spacing:-.8px;line-height:1.3;margin:0 0 9px}h2{font-size:17px;margin:0 0 13px}h3{font-size:14px;margin:0 0 9px}p{margin:0 0 14px}.subtitle{color:var(--muted);font-size:13px;margin:0}.badge{display:inline-block;font-size:11px;padding:3px 8px;border-radius:4px;background:#eef0f3;color:#616774;white-space:nowrap}.badge.red{color:var(--red);background:#fbeaec}.badge.green{color:var(--green);background:#eaf5f0}.badge.amber{color:var(--amber);background:#fff4df}.primary{background:var(--red);border-color:var(--red);color:white}.primary:hover{background:#b3232e}.panel{background:white;border:1px solid var(--line);border-radius:7px;padding:23px;margin-bottom:20px}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:18px}.panel-head h2{margin:0}.small{font-size:12px;color:var(--muted)}.grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:20px}.equal{grid-template-columns:1fr 1fr}.metrics{display:grid;grid-template-columns:repeat(4,1fr);background:white;border:1px solid var(--line);border-radius:7px;margin:0 0 22px}.metric{padding:20px 23px;border-right:1px solid var(--line)}.metric:last-child{border:0}.metric strong{font-size:29px;font-weight:600;line-height:1.5;display:block;font-variant-numeric:tabular-nums}.metric small{font-size:11px;color:var(--muted)}.metric label{color:#626671;font-size:12px}.feature-intro{display:grid;grid-template-columns:1.6fr 1fr;background:#202329;color:white;border-radius:7px;overflow:hidden;margin-bottom:23px}.feature-intro>div{padding:29px}.feature-intro h2{font-size:22px;line-height:1.5;margin:7px 0 10px}.feature-intro p{color:#b9bdc5;font-size:12px;max-width:530px}.intro-aside{border-left:1px solid #3d4047;display:flex;flex-direction:column;justify-content:center;gap:14px}.intro-aside div{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #3d4047;padding-bottom:12px;font-size:12px}.intro-aside div:last-child{border:0;padding:0}.intro-aside span{color:#a7adb8}.eyebrow{font-size:10px;letter-spacing:2px;color:#db9da2}.flow{display:flex;gap:8px;align-items:stretch;margin:15px 0;overflow-x:auto;padding-bottom:5px}.step{flex:1;min-width:95px;border:1px solid var(--line);background:#fafafb;padding:12px;border-radius:5px}.step b{display:block;font-size:12px;margin:5px 0}.step small{font-size:10px;color:var(--muted)}.step-num{color:var(--red);font-size:11px}.arrow{align-self:center;color:#b8bbc2}.flow-tab{display:flex;gap:6px}.flow-tab button{font-size:11px;padding:6px 10px}.flow-tab .selected{background:var(--ink);color:white;border-color:var(--ink)}.note{border-left:3px solid var(--red);background:#fcf5f5;padding:13px 16px;font-size:12px;color:#6d5054;margin:14px 0 0}.module-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.module-card{padding:17px;text-align:left;display:block;width:100%;min-height:125px;border-radius:6px}.module-card .num{color:var(--red);font-size:11px}.module-card b{display:block;font-size:14px;margin:7px 0}.module-card small{display:block;color:var(--muted);font-size:11px;line-height:1.7}.module-card:hover{background:#fcf9f9;border-color:#d7a4a9}.rules{list-style:none;padding:0;margin:0}.rules li{padding:11px 0;border-bottom:1px solid #eee;display:flex;gap:12px;align-items:flex-start}.rules li:last-child{border:0}.rules .n{color:var(--red);font-size:11px;padding-top:3px}.rules b{display:block;font-size:12px}.rules small{display:block;color:var(--muted);font-size:11px;margin-top:3px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:12px;text-align:left}th{background:#f6f7f9;color:#696e78;font-size:11px;font-weight:500;padding:11px 13px;white-space:nowrap}td{padding:12px 13px;border-bottom:1px solid #eee;vertical-align:top}tr:last-child td{border:0}tbody tr:hover{background:#fcfcfd}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:11px;color:#717784}.toolbar{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-bottom:16px;flex-wrap:wrap}input,select{border:1px solid #d8dae0;border-radius:5px;padding:8px 11px;background:white;max-width:100%;color:var(--ink)}input:focus,select:focus{outline:2px solid #edc2c6;outline-offset:1px}input[type=search]{min-width:280px}.field-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.field label{display:block;color:#696e78;font-size:11px;margin-bottom:6px}.field input,.field select{width:100%;font-size:13px}.calc-total{margin-top:20px;border-top:1px solid var(--line);padding-top:18px;display:flex;justify-content:space-between;align-items:center}.calc-total strong{font-size:30px;font-weight:600;color:var(--red)}.timeline{padding:0;list-style:none}.timeline li{position:relative;padding:0 0 20px 22px;border-left:1px solid #e0e2e6;margin-left:5px}.timeline li:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--red);position:absolute;left:-4px;top:7px}.timeline li:last-child{border-color:transparent;padding-bottom:0}.timeline b{font-size:12px}.timeline small{display:block;font-size:11px;color:var(--muted)}.tabs{display:flex;gap:22px;border-bottom:1px solid var(--line);margin-bottom:22px;overflow:auto}.tabs button{border:0;border-radius:0;border-bottom:2px solid transparent;background:transparent;padding:10px 0;white-space:nowrap;font-size:12px}.tabs button.selected{border-color:var(--red);color:var(--red)}.check{color:var(--green)}.dash{color:#a6aab2}.footer{display:flex;justify-content:space-between;gap:15px;font-size:10px;color:#9599a3;margin-top:25px}.paper{max-width:850px;margin:auto;background:#fff;padding:40px;border:1px solid #ddd;box-shadow:0 6px 20px #00000006}.paper h2{text-align:center;font-size:19px}.paper h3{text-align:center;font-size:24px;letter-spacing:5px;margin:10px 0 25px}.paper-meta{display:flex;justify-content:space-between;font-size:12px;margin:12px 0}.paper table th,.paper table td{border:1px solid #bbb}.paper .signs{display:flex;justify-content:space-between;margin-top:45px;font-size:12px}.skeleton{border:1px dashed #cdd0d7;padding:20px;font-size:12px;color:var(--muted);border-radius:5px}.empty{text-align:center;padding:30px;color:var(--muted)}dialog{width:min(620px,90vw);max-height:85vh;border:1px solid var(--line);border-radius:9px;padding:28px;color:var(--ink)}dialog::backdrop{background:#16191f75}dialog .close{float:right}dialog p{font-size:13px;color:var(--muted)}.mobile-nav{display:none}.demo-strip{font-size:11px;background:#fff8eb;border:1px solid #f0e1c3;color:#866734;padding:9px 13px;border-radius:5px;margin-bottom:20px}.detail-list{display:grid;grid-template-columns:130px 1fr;gap:9px;font-size:12px}.detail-list dt{color:var(--muted)}.detail-list dd{margin:0}.phase{display:grid;grid-template-columns:38px 1fr;gap:10px;padding:15px 0;border-bottom:1px solid var(--line)}.phase:last-child{border:0}.phase .idx{font-size:21px;color:#b3b8c2}.phase b{font-size:13px}.phase p{color:var(--muted);font-size:12px;margin:4px 0 0}@media(min-width:1500px){main{padding-top:40px}}@media(max-width:1100px){main{padding:25px}.app{grid-template-columns:195px minmax(0,1fr)}.grid2{grid-template-columns:1fr}.module-grid{grid-template-columns:repeat(2,1fr)}.feature-intro{grid-template-columns:1.4fr 1fr}}@media(max-width:700px){header{padding:0 16px}.head-right>span{display:none}.app{display:block}aside{display:none;position:relative;top:0;height:auto;border-bottom:1px solid var(--line)}aside.open{display:block}.aside-bottom{display:none}.mobile-nav{display:block}.brand b{font-size:13px}.brand small{letter-spacing:1px}main{padding:20px 16px}.title-row{align-items:flex-start}h1{font-size:24px}.feature-intro{grid-template-columns:1fr}.intro-aside{border-left:0;border-top:1px solid #3d4047}.metrics{grid-template-columns:1fr 1fr}.metric:nth-child(2){border-right:0}.metric:nth-child(-n+2){border-bottom:1px solid var(--line)}.metric{padding:15px}.module-grid{grid-template-columns:1fr 1fr}.panel{padding:17px}.panel-head{align-items:flex-start;flex-direction:column}.field-grid{grid-template-columns:1fr}.paper{padding:20px;overflow:auto}.paper-meta{flex-wrap:wrap;gap:8px}.paper .signs{gap:20px;flex-wrap:wrap}.footer{flex-direction:column}.title-row>.badge{display:none}input[type=search]{min-width:0;width:100%}.toolbar>input{flex:1}}@media print{header,aside,.breadcrumb,.title-row,.footer,.demo-strip,.no-print{display:none!important}.app{display:block}main{padding:0;max-width:none}body{background:white}.paper{max-width:none;border:0;box-shadow:none;padding:10mm}.panel{break-inside:avoid}.paper th{background:#eee!important}thead{display:table-header-group}tr{break-inside:avoid}@page{size:A4;margin:12mm}}

<body>
<header><div class="brand"><div class="mark">锦</div><div><b>锦安 · 气瓶与物料管理</b><small>JINAN / WAREHOUSE MANAGEMENT</small></div></div><div class="head-right"><span>潍坊锦安特种设备检测有限公司</span><span>功能设计 · v0.2</span><button class="mobile-nav" id="menuToggle" aria-label="展开导航">菜单</button></div></header>
<div class="app"><aside id="sidebar"><div class="nav-label">功能设计 / Design</div><nav class="nav" id="nav" aria-label="功能模块"></nav><div class="aside-bottom"><strong>山东省安丘市</strong>客户气瓶流转 · 公司材料库存<br>本地演示，未连接业务数据库</div></aside><main id="main"></main></div>
<dialog id="detail"><button class="close" onclick="document.getElementById('detail').close()" aria-label="关闭详情">关闭</button><div id="detailBody"></div></dialog>
<script>
const modules=[
 ['overview','设计总览','业务边界、模块与核心流程'],
 ['cylinders','气瓶档案','一瓶一码，客户所有权与状态追踪'],
 ['inspection','接收与检测','送检接收、检测登记、客户返还'],
 ['materials','原材料管理','11个候选档案，规格与单位拆分'],
 ['inventory','出入库与库存','单据过账、流水、盘点与日报'],
 ['partners','客户与供应商','往来档案、代管气瓶与对账'],
 ['settlement','收付款管理','应收应付、分次结算与余额'],
 ['rules','计费与报废规则','后台配置，版本生效与历史快照'],
 ['permissions','组织与权限','用户、角色、部门、菜单和操作权限'],
 ['print','单据打印','A4出入库单与交接签字'],
 ['delivery','实施范围','分期交付、部署与验收标准']
];
let current='overview',flowMode='cylinder',ruleMode='pricing',permissionRole='仓库人员';
const main=document.getElementById('main');
const tag=(t,c='')=>`<span class="badge ${c}">${t}</span>`;
const table=(headers,rows)=>`<div class="table-wrap"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
const panel=(title,body,right='')=>`<section class="panel"><div class="panel-head"><h2>${title}</h2>${right}</div>${body}</section>`;
const note=t=>`<div class="note">${t}</div>`;
const rules=items=>`<ol class="rules">${items.map((x,i)=>`<li><span class="n">${String(i+1).padStart(2,'0')}</span><div><b>${x[0]}</b><small>${x[1]}</small></div></li>`).join('')}</ol>`;
const steps=items=>`<div class="flow">${items.map((x,i)=>`${i?'<span class="arrow">→</span>':''}<div class="step"><span class="step-num">${String(i+1).padStart(2,'0')}</span><b>${x[0]}</b><small>${x[1]}</small></div>`).join('')}</div>`;
function title(t,desc,scope='首期核心'){return `<div class="breadcrumb">锦安 WMS <span>/</span> 功能设计 <span>/</span> ${t}</div><div class="title-row"><div><h1>${t}</h1><p class="subtitle">${desc}</p></div>${tag(scope,'red')}</div>`}
function demo(){return '<div class="demo-strip">设计演示：客户、瓶号、数量与金额均为示例，不代表公司实际业务；原材料名称与属性参考所提供的台账。</div>'}
function footer(){return '<footer class="footer"><span>潍坊锦安特种设备检测有限公司 · 功能设计评审</span><span>2026.09 / 本文件可离线打开</span></footer>'}
function go(id){if(!modules.some(m=>m[0]===id))id='overview';current=id;location.hash=id;document.querySelectorAll('#nav button').forEach(b=>{b.classList.toggle('active',b.dataset.id===id);b.setAttribute('aria-current',b.dataset.id===id?'page':'false')});main.innerHTML=views[id]()+footer();document.getElementById('sidebar').classList.remove('open');window.scrollTo(0,0);if(id==='materials')filterMaterials();if(id==='rules'&&ruleMode==='pricing')calculate();}
document.getElementById('nav').innerHTML=modules.map((m,i)=>`<button data-id="${m[0]}" onclick="go('${m[0]}')"><span>${String(i).padStart(2,'0')}</span>${m[1]}</button>`).join('');
document.getElementById('menuToggle').onclick=()=>document.getElementById('sidebar').classList.toggle('open');
window.addEventListener('hashchange',()=>{if(location.hash.slice(1)!==current)go(location.hash.slice(1))});
const views={};
views.overview=()=>title('把每一只瓶、每一笔库存管清楚','轻量 WMS 功能蓝图 · 面向十几人的检测与仓储团队','方案评审')+`<section class="feature-intro"><div><div class="eyebrow">业务主线 / BUSINESS SCOPE</div><h2>客户的气瓶，逐只追溯。<br>公司的材料，按量管理。</h2><p>围绕接收、检测、返还与材料耗用建立业务闭环。收费、报废条件由后台配置，已确认业务保留历史依据。</p><button onclick="go('inspection')" class="primary">查看气瓶流转设计 →</button></div><div class="intro-aside"><div><span>气瓶所有权</span><b>客户代管为主</b></div><div><span>公司自有库存</span><b>原材料为主</b></div><div><span>气瓶购销</span><b>可选扩展，默认关闭</b></div></div></section><div class="metrics"><div class="metric"><label>业务主线</label><strong>02</strong><small>气瓶流转 / 材料收发</small></div><div class="metric"><label>材料候选档案</label><strong>11</strong><small>来自原材料台账</small></div><div class="metric"><label>建议初始角色</label><strong>05</strong><small>角色可按职责调整</small></div><div class="metric"><label>关键配置</label><strong>02</strong><small>计费方案 / 报废规则</small></div></div>`+panel('两条完整的业务流程',`<div id="flowDisplay">${flowContent()}</div>`,`<div class="flow-tab"><button onclick="switchFlow('cylinder')" id="flow-cylinder" class="${flowMode==='cylinder'?'selected':''}">客户气瓶</button><button onclick="switchFlow('material')" id="flow-material" class="${flowMode==='material'?'selected':''}">公司原材料</button></div>`)+`<div class="grid2">${panel('功能模块地图',`<div class="module-grid">${modules.slice(1,10).map((m,i)=>`<button class="module-card" onclick="go('${m[0]}')"><span class="num">${String(i+1).padStart(2,'0')} ↗</span><b>${m[1]}</b><small>${m[2]}</small></button>`).join('')}</div>`)}${panel('设计中的四条底线',rules([['所有权清楚','客户送检不产生采购应付，也不进入公司可销售库存。'],['库存只在过账后改变','草稿不影响库存；重复点击不能重复收发。'],['费用与成本分开','采购单价、领用成本、客户收费各有独立含义。'],['历史可追溯','改价、改规则不回写旧单；报废保留瓶号与处置记录。']])+note('本页为功能设计展示，点击左侧模块可查看字段、流程和交互示例。'))}</div>`;
function flowContent(){return flowMode==='cylinder'?steps([['接收入库','登记客户与瓶号'],['检测登记','结果与材料耗用'],['结算确认','按配置生成费用'],['客户返还','交接与出库'],['收款核销','支持分次结算']])+note('应收确认节点可以配置；流程图展示推荐路径。报废气瓶进入单独处置流程。'):steps([['采购入库','供应商与成交价'],['领用出库','关联部门或检测'],['库存流水','数量与成本追溯'],['付款核销','应付、已付、未付']])+note('材料领用减少公司库存；是否向客户收费由计费方案决定，不等同于材料成本。')}
function switchFlow(mode){flowMode=mode;document.getElementById('flowDisplay').innerHTML=flowContent();document.querySelectorAll('.flow-tab button').forEach(b=>b.classList.toggle('selected',b.id==='flow-'+mode))}
views.cylinders=()=>title('气瓶档案','规格定义一类瓶，唯一编码识别一只瓶。')+demo()+`<div class="grid2">${panel('单瓶档案示例',`<div class="panel-head"><span class="mono">CYL-DEMO-0001</span>${tag('客户代管','green')}</div><dl class="detail-list"><dt>原始瓶号</dt><dd>DEMO-240001</dd><dt>所有方</dt><dd>示例客户 A</dd><dt>类型 / 容量</dt><dd>示例气瓶 / 40 L</dd><dt>制造单位 / 型号</dt><dd>按铭牌录入</dd><dt>制造日期</dt><dd>按实际档案维护</dd><dt>实物位置</dt><dd>在库 · 待检区 A-01</dd><dt>检测状态</dt><dd>${tag('待检','amber')}</dd><dt>生命周期</dt><dd>${tag('正常','green')}</dd></dl><button onclick="cylinderDetail()">查看追溯时间线 →</button>`)}${panel('三组状态，分别记录',rules([['实物位置','在库 / 已发出，关联仓库和库位。'],['检测状态','待检 / 合格 / 不合格 / 待复检。'],['生命周期','正常 / 报废待处置 / 已处置。']])+note('报废待处置的瓶仍可能在库，不能提前从实物库存中消失。'))}</div>`+panel('气瓶类型与规格配置',table(['属性组','字段','设计说明'],[['身份','类型编码、规格编码、名称','启停管理，引用后的档案不直接删除'],['物理属性','容量及单位、介质、压力、材质','按真实经营范围配置，不内置示例标准'],['价格','默认检测费、可选购销价','仅作开单参考，成交价保留快照'],['唯一性','内部编码、原始瓶号、制造单位','内部编码唯一，原始瓶号可按厂家联合核验'],['追溯','所有方、位置、检测和报废历史','再次送检复用同一档案，产生新业务周期']]));

views.rules=()=>title('计费与报废规则','把业务差异放进配置，同时保留每次执行的依据。','可配置')+`<div class="tabs"><button class="${ruleMode==='pricing'?'selected':''}" onclick="ruleMode='pricing';go('rules')">计费方案与试算</button><button class="${ruleMode==='scrap'?'selected':''}" onclick="ruleMode='scrap';go('rules')">报废条件与处置</button></div>`+(ruleMode==='pricing'?pricingView():scrapView());
function pricingView(){return `<div class="grid2 equal">${panel('计费方案 · 本地试算',`<p class="small">输入只用于演示，不保存配置或产生应收。</p><div class="field-grid"><div class="field"><label for="chargeMode">计费方式</label><select id="chargeMode" onchange="calculate()"><option value="unit">按只计费</option><option value="service">按服务次数</option><option value="material">按材料数量</option><option value="batch">按批固定金额</option></select></div><div class="field"><label for="feeStage">应收确认节点</label><select id="feeStage" onchange="calculate()"><option>检测结算确认</option><option>接收入库确认</option><option>返还出库确认</option></select></div><div class="field"><label id="quantityLabel" for="feeQty">气瓶数量（只）</label><input id="feeQty" type="number" min="0" step="1" value="10" oninput="calculate()"></div><div class="field"><label id="priceLabel" for="feePrice">单价（元 / 只）</label><input id="feePrice" type="number" min="0" step="0.01" value="30" oninput="calculate()"></div></div><div class="calc-total"><div><span class="small">费用试算</span><div id="calcExplain" class="small"></div></div><strong id="calcAmount"></strong></div>`)}${panel('配置需要保存的属性',rules([['适用范围','客户/客户组、气瓶类型、规格、检测结果、业务类型。'],['费用项目','检测费、材料费、运输费与其他费用，可启停。'],['规则优先级','客户专属 → 客户组 → 通用价；同级冲突必须消除。'],['版本与生效时间','发布时生效，新规则不影响已确认报价和旧单。'],['调整权限','授权人员可以改价，原因和调整金额单独留痕。']]))}</div>`+note('找不到规则时转人工录价，不能自动按零元收费。按批收费只生成一次；同一服务与费用来源不重复产生应收。')}
function calculate(){let mode=document.getElementById('chargeMode').value,qEl=document.getElementById('feeQty'),pEl=document.getElementById('feePrice'),q=Number(qEl.value),p=Number(pEl.value),batch=mode==='batch';qEl.disabled=batch;const names={unit:['气瓶数量（只）','单价（元 / 只）'],service:['服务次数','单价（元 / 次）'],material:['材料数量（基础单位）','单价（元 / 基础单位）'],batch:['数量不参与批次计费','每批固定金额（元）']};document.getElementById('quantityLabel').textContent=names[mode][0];document.getElementById('priceLabel').textContent=names[mode][1];qEl.step=mode==='material'?'0.0001':'1';let valid=pEl.value!==''&&Number.isFinite(p)&&p>=0&&(batch||(qEl.value!==''&&Number.isFinite(q)&&q>=0&&(mode==='material'||Number.isInteger(q))));document.getElementById('calcAmount').textContent=valid?'¥'+(batch?p:q*p).toFixed(2):'—';document.getElementById('calcExplain').textContent=valid?(batch?'每批一次计费':`${q} × ¥${p.toFixed(2)}`)+' · '+document.getElementById('feeStage').value:'请输入有效的非负数量和金额；瓶数及次数须为整数。'}
